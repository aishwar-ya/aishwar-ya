<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 50" width="1000" height="50" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#6C5CE7"/><stop offset=".5" stop-color="#F75C7E"/><stop offset="1" stop-color="#6C5CE7"/></linearGradient>
<style>
.w1{animation:m 9s linear infinite}
.w2{animation:m 14s linear infinite reverse}
@keyframes m{from{transform:translateX(0)}to{transform:translateX(-500px)}}
.dot{animation:p 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes p{0%,100%{transform:scale(.7);opacity:.6}50%{transform:scale(1.2);opacity:1}}
</style>
</defs>
<g fill="none" stroke-linecap="round">
<path class="w2" stroke="url(#g)" stroke-opacity=".35" stroke-width="2" d="M0 25 Q125 5 250 25 T500 25 T750 25 T1000 25 T1250 25 T1500 25"/>
<path class="w1" stroke="url(#g)" stroke-width="3" d="M0 25 Q125 45 250 25 T500 25 T750 25 T1000 25 T1250 25 T1500 25"/>
</g>
<circle class="dot" cx="500" cy="25" r="5" fill="#F75C7E"/>
</svg>
